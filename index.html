    <!-- the loader is plain HTML so the mark is on the first paint, before any script runs;
         src/components/Loader.tsx drives it once the app is up -->
    <style>
      .loader { position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; background: #0d0c0b; clip-path: inset(0% 0% 0% 0%); }
      .loader__mark { position: relative; width: clamp(132px, 13vw, 200px); color: #f7a600; }
      .loader__mark svg { display: block; width: 100%; height: auto; }
      /* while the app boots only the ghost breathes: slow, low-contrast opacity hides a stalled frame */
      .loader__ghost { opacity: 0.14; animation: loader-breathe 1.6s ease-in-out infinite alternate; }
      @keyframes loader-breathe { from { opacity: 0.1; } to { opacity: 0.26; } }
      /* the amber copy, uncovered left to right by two counter-moving transforms */
      .loader__wipe { position: absolute; inset: 0; overflow: hidden; transform: translateX(-100%); }
      .loader__wipe > svg { transform: translateX(100%); }
      @media (prefers-reduced-motion: reduce) { .loader__ghost { animation: none; } }
    </style>
    <noscript><style>.loader { display: none; }</style></noscript>
  </head>
